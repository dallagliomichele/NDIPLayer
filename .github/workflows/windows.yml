name: Windows build and tests
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test release version options
        shell: powershell
        run: ./tests/VersionReleaseTests.ps1
      - name: Build installer and test
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:RUNNER_TEMP 'NDI6Runtime.exe'
          Invoke-WebRequest 'https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20Runtime.exe' -OutFile $runtime
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found on runner' }
          ./installer/build-installer.ps1 -RuntimeFile $runtime -IsccPath $iscc
          "version=$((Get-Content -Raw VERSION).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: NDIPlayer-${{ steps.build.outputs.version }}-Setup-win-x64
          path: dist/NDIPlayer-${{ steps.build.outputs.version }}-Setup-win-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-LGPL-20261031-build-dependency
          path: bin/video-package/ffmpeg-n8.1.3-27-g8dca1586f4-win64-lgpl-shared-8.1.zip
          if-no-files-found: error
